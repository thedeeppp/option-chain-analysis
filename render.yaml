# Render blueprint. In Render: New → Blueprint → point at this repo.
# Single instance / single worker is required: the background NSE poller and the
# in-memory state must live in ONE process (multiple workers = duplicate polling).
services:
  - type: web
    name: nse-oi-tracker
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: START_POLLER=1 gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TZ
        value: Asia/Kolkata
